<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: site-header}"></header>

<main id="main" class="container auth">
    <div class="form-shell--narrow">
        <h1>Welcome back</h1>
        <p class="auth__lede">Sign in to list items and see sellers&rsquo; contact details.</p>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form th:action="@{/login}" method="post" class="form-card" novalidate>
            <div class="field">
                <label for="username" class="label">Email</label>
                <input type="email" id="username" name="username" class="input"
                       th:value="${email}" th:attr="aria-invalid=${errorMessage != null} ? 'true' : null"
                       autocomplete="username" inputmode="email" maxlength="150" required
                       th:autofocus="${email == null}">
            </div>
            <div class="field">
                <label for="password" class="label">Password</label>
                <input type="password" id="password" name="password" class="input"
                       autocomplete="current-password" maxlength="64" required
                       th:autofocus="${email != null}">
            </div>
            <label class="check">
                <input type="checkbox" name="remember-me"> Keep me signed in for two weeks
            </label>
            <div class="form-actions">
                <button type="submit" class="btn btn--primary btn--block" data-busy-label="Signing in"><span>Sign in</span></button>
            </div>
        </form>

        <p class="demo-note" th:if="${demoHints}">
            Demo accounts: <code>student1@campus.edu</code> or <code>student2@campus.edu</code>, password <code>password123</code>
        </p>

        <p class="auth__switch">New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
