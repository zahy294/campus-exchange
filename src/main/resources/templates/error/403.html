<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Not allowed')}"></head>
<body>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: site-header}"></header>

<main id="main" class="container">
    <div class="error-page">
        <span class="error-page__code">Error 403</span>
        <h1>That listing isn&rsquo;t yours to change.</h1>
        <p>Only the student who posted a listing can edit, sell or delete it. If you think this is a mistake, check you&rsquo;re signed in with the right account.</p>
        <div class="error-page__actions">
            <a th:href="@{/my/listings}" class="btn btn--primary">Go to my listings</a>
            <a th:href="@{/}" class="btn btn--ghost">Home</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
