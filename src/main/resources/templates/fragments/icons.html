<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  One stroke icon set (24px grid, 1.75 stroke, round caps), drawn after Lucide (ISC licence).
  Usage: <svg th:replace="~{fragments/icons :: icon('search')}"></svg>
-->
<svg th:fragment="icon(name)" class="icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <th:block th:switch="${name}">
        <g th:case="'search'"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></g>
        <g th:case="'plus'"><path d="M5 12h14M12 5v14"/></g>
        <g th:case="'book'"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></g>
        <g th:case="'device'"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.3 2.6a1 1 0 0 1-.9 1.4H3.6a1 1 0 0 1-.9-1.4L4 16"/></g>
        <g th:case="'user'"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></g>
        <g th:case="'logout'"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></g>
        <g th:case="'edit'"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></g>
        <g th:case="'trash'"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></g>
        <g th:case="'check'"><path d="M20 6 9 17l-5-5"/></g>
        <g th:case="'check-circle'"><circle cx="12" cy="12" r="9.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></g>
        <g th:case="'alert'"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5M12 16.5h.01"/></g>
        <g th:case="'arrow-left'"><path d="m12 19-7-7 7-7M19 12H5"/></g>
        <g th:case="'arrow-right'"><path d="M5 12h14M12 5l7 7-7 7"/></g>
        <g th:case="'mail'"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g>
        <g th:case="'phone'"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.1-.45c.9.34 1.84.6 2.8.7a2 2 0 0 1 1.7 2Z"/></g>
        <g th:case="'undo'"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></g>
        <g th:case="'x'"><path d="M18 6 6 18M6 6l12 12"/></g>
        <g th:case="'chevron-down'"><path d="m6 9 6 6 6-6"/></g>
        <g th:case="'chevron-left'"><path d="m15 18-6-6 6-6"/></g>
        <g th:case="'chevron-right'"><path d="m9 18 6-6-6-6"/></g>
        <g th:case="'lock'"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g>
        <g th:case="'refresh'"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.9 1 6.7 2.7L21 8"/><path d="M21 3v5h-5"/></g>
        <g th:case="'building'"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2M10 6h4M10 10h4M10 14h4M10 18h4"/></g>
        <g th:case="'pin'"><path d="M12 17v5M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2v.8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></g>
        <g th:case="'list'"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></g>
        <g th:case="'menu'"><path d="M4 7h16M4 12h16M4 17h16"/></g>
    </th:block>
</svg>

<!-- Brand mark: a notice card pinned to the board. -->
<svg th:fragment="logo" class="logo-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false">
    <g transform="rotate(-7 16 17)">
        <rect x="5" y="7" width="22" height="20" rx="3" fill="var(--accent)"/>
        <path d="M10 15h12M10 19.5h8" stroke="var(--card)" stroke-width="2" stroke-linecap="round"/>
    </g>
    <circle cx="16" cy="7.5" r="3.6" fill="var(--stamp)"/>
    <circle cx="15" cy="6.6" r="1.1" fill="var(--card)" opacity=".7"/>
</svg>
</body>
</html>
