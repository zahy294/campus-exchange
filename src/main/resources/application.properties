spring.application.name=campus-exchange
server.port=8080

# Default embedded database: Persistent H2 in MySQL mode so the app runs out-of-the-box with zero setup
spring.datasource.url=jdbc:h2:file:./data/campus_exchange;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Database Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

# Signs remember-me cookies. Override in any shared deployment.
app.remember-me.key=${REMEMBER_ME_KEY:campus-exchange-dev-key}
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.mvc.problemdetails.enabled=false

# Never leak stack traces in error responses (devtools enables them by default)
server.error.include-stacktrace=never
server.error.include-exception=false
