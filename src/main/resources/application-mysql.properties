spring.application.name=campus-exchange-mysql
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/campus_exchange?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m

app.remember-me.key=${REMEMBER_ME_KEY:campus-exchange-dev-key}
server.error.whitelabel.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Never leak stack traces in error responses (devtools enables them by default)
server.error.include-stacktrace=never
server.error.include-exception=false
